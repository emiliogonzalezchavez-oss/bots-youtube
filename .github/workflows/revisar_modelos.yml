name: Revisar modelos de coche (stills de calidad)

on:
  workflow_dispatch:
    inputs:
      modelos:
        description: "UIDs de Sketchfab separados por coma"
        default: "d01b254483794de3819786d93e0e1ebf,8568d9d14a994b9cae59499f0dbed21e,b2303a552b444e5b8637fdf5169b41cb,2b509d1bce104224b147c81757f6f43a,b53782a00cc240a191d5d7d005af1423,b7616ec43ecf4ffd8ed810d94f15eea6,a5737bf3cc9b4179a6e5ebe173ff70d9,9b13e93711db460b99749ae95aea9764,e738eae819c34d19a31dd066c45e0f3d,7b142ea3376e4811a326256c59bbc7a2"

      tomas:
        description: "tomas a renderizar (separadas por coma)"
        default: "hero,trasera,perfil,rueda"
      variantes:
        description: "JSON con overrides del plan para comparar (solo toma hero), ej. [{\"exposure\":0}]"
        default: ""
      livery:
        description: "vacío = sin decoración; 'variado' = una distinta por modelo; o el nombre de una"
        default: ""

permissions:
  contents: write

env:
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.l.outputs.m }}
    steps:
      - id: l
        run: echo "m=$(python3 -c "import json;print(json.dumps('${{ inputs.modelos }}'.split(',')))")" >> $GITHUB_OUTPUT

  still:
    needs: lista
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        uid: ${{ fromJSON(needs.lista.outputs.m) }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3 > /dev/null
      - uses: actions/cache@v4
        with: { path: ~/blender, key: blender-4.2.3 }
      - run: if [ ! -x ~/blender/blender ]; then mkdir -p ~/blender && curl -sfL "$BLENDER_URL" | tar -xJ -C ~/blender --strip-components=1; fi
      - name: Bajar modelo
        env: { SKETCHFAB_TOKEN: "${{ secrets.SKETCHFAB_TOKEN }}" }
        run: echo "CAR=$(bash edits/bajar_modelo.sh ${{ matrix.uid }} m)" >> $GITHUB_ENV
      - name: Stills
        env: { VARIANTES: "${{ inputs.variantes }}" }
        run: |
          LIV="${{ inputs.livery }}"
          if [ "$LIV" = "variado" ]; then LIV=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print((m.get('${{ matrix.uid }}',{}).get('estilos') or ['gt3_blanco'])[0])"); fi
          echo "{\"id\":\"${{ matrix.uid }}_$LIV\",\"livery\":\"$LIV\",\"fps\":30,\"shots\":[]}" > p.json
          python3 -c "import json;p=json.load(open('p.json'));p['shots']=[{'name':t.strip(),'frames':30} for t in '${{ inputs.tomas }}'.split(',')];json.dump(p,open('p.json','w'))"
          bash edits/bajar_estudio.sh m/estudio.hdr && python3 -c "import json;p=json.load(open('p.json'));p['hdri_estudio']='m/estudio.hdr';json.dump(p,open('p.json','w'))" || true
          cat p.json
          GIRAR=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print('--girar' if m.get('${{ matrix.uid }}',{}).get('girar') else '')")
          if [ "$VARIANTES" = "dump" ]; then
            ~/blender/blender -b -noaudio -P edits/blender_edit.py -- --car "$CAR" --uid "${{ matrix.uid }}" $GIRAR --plan p.json --shot 0 --out out --still --dump 2>&1 | grep -E "^LUZ|rror" | sort -u | head -150
            mkdir -p out; echo dump > out/dump.txt
          elif [ -n "$VARIANTES" ]; then
            python3 edits/variantes.py
            for f in v*.json; do
              ~/blender/blender -b -noaudio -P edits/blender_edit.py -- --car "$CAR" --uid "${{ matrix.uid }}" $GIRAR --plan $f --shot 0 --out out --still 2>&1 | grep -E "LISTO|rror|LLANTAS|DIRECCION|VENTANA|DOF|PINTURA|Estudio" | tail -12
            done
          else
            for s in $(python3 -c "import json;print(' '.join(str(i) for i in range(len(json.load(open('p.json'))['shots']))))"); do
              ~/blender/blender -b -noaudio -P edits/blender_edit.py -- --car "$CAR" --uid "${{ matrix.uid }}" $GIRAR --plan p.json --shot $s --out out --still 2>&1 | grep -E "COCHE|LISTO|Error|rror|^MAT|PINTURA|APOYO|LUZFIX" | tail -40
            done
          fi
          ls -la out
      - name: Acabado de foto (grano, aberración, viñeteo, EXIF)
        run: |
          pip install -q pillow numpy piexif
          ls out/*.jpg >/dev/null 2>&1 && python3 edits/post_foto.py out/*.jpg || true
      - uses: actions/upload-artifact@v4
        with: { name: "still-${{ matrix.uid }}", path: out/ }

  guardar:
    needs: still
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: arte, merge-multiple: true }
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          if git fetch -q origin renders:renders 2>/dev/null; then git switch -q renders; else git switch -q --orphan renders; fi
          D=revision-$(date -u +%Y%m%d-%H%M); mkdir -p "$D"; cp arte/*.jpg "$D"/ || true
          git add "$D"; git commit -qm "revision $D"; git push -q origin renders; echo "$D"
