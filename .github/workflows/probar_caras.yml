name: Probar detector de caras
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip install -q opencv-python-headless numpy
          python3 -c "import cv2;print('opencv', cv2.__version__)"
          curl -sL -o edits/analisis/yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          ls -la edits/analisis/yunet.onnx; head -c 4 edits/analisis/yunet.onnx | xxd | head -1
          curl -sL -o /tmp/lena.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg
          python3 edits/analisis/probar_caras.py /tmp/lena.jpg
          git config user.name github-actions; git config user.email actions@github.com
          git add edits/analisis/yunet.onnx && git commit -qm "Modelo YuNet (detector de caras, Apache-2.0, opencv_zoo)" && git push -q || true
