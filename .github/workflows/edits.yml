name: Edit de coche (Blender)

on:
  schedule:
    - cron: "0 18 * * *"   # edit diario (12:00 hora México): coche aprobado al azar, render completo; bot-youtube lo sube a Clipazo
  workflow_dispatch:
    inputs:
      modelo:
        description: "UID de Sketchfab de un modelo APROBADO (vacío = uno aprobado al azar)"
        default: ""
      preview:
        description: "true = 1 frame por toma a resolución completa (revisión antes del render largo)"
        default: "true"
      musica:
        description: "URL del mp3 (vacío = phonk al azar de edits/musica.json, sin Content ID)"
        default: ""
      segundos:
        description: "Duración del edit"
        default: "14"
      escenario:
        description: "estudio | exterior | vacío = al azar"
        default: ""
      color:
        description: "teal | calido | mono | vacío = al azar"
        default: ""
      livery:
        description: "vacío = una de las versiones modificadas de ese coche (modelos.json estilos); o gt3_blanco | guards_red | miami_blue | gulf | negro_oro | verde_python | amarillo | rojo_blanco | morado | naranja | vacío = al azar"
        default: ""

permissions:
  contents: write

env:
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tomas: ${{ steps.p.outputs.tomas }}
      modelo: ${{ steps.e.outputs.modelo }}
      preview: ${{ steps.e.outputs.preview }}
      subir: ${{ steps.e.outputs.subir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q librosa
      - id: e
        name: Elegir coche
        run: |
          M="${{ inputs.modelo }}"
          [ -z "$M" ] && M=$(python3 -c "import json,random;print(random.choice([x['uid'] for x in json.load(open('edits/modelos.json')) if x.get('aprobado')]))")
          if [ "${{ github.event_name }}" = "schedule" ]; then P=false; S=true; else P="${{ inputs.preview }}"; S=false; fi
          echo "Coche: $M  preview=$P  subir=$S"
          echo "MODELO=$M" >> $GITHUB_ENV; echo "PREV=$P" >> $GITHUB_ENV
          echo "modelo=$M" >> $GITHUB_OUTPUT; echo "preview=$P" >> $GITHUB_OUTPUT; echo "subir=$S" >> $GITHUB_OUTPUT
      - id: p
        run: |
          URL="${{ inputs.musica }}"
          [ -z "$URL" ] && URL=$(python -c "import json,random;print(random.choice(json.load(open('edits/musica.json')))['mp3'])")
          echo "$URL" > musica_url.txt
          echo "Música: $URL"
          curl -sfL -A "Mozilla/5.0" "$URL" -o musica.mp3
          LIV="${{ inputs.livery }}"
          [ -z "$LIV" ] && LIV=$(python3 -c "import json,random;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print(random.choice(m.get('$MODELO',{}).get('estilos') or ['gt3_blanco']))")
          echo "Livery: $LIV"
          python edits/plan.py musica.mp3 plan.json ${{ inputs.segundos || '14' }} "${{ inputs.escenario }}" "${{ inputs.color }}" "$LIV"
          python -c "import json;p=json.load(open('plan.json'));p['modelo_uid']='$MODELO';p['musica_url']=open('musica_url.txt').read().strip();json.dump(p,open('plan.json','w'),indent=1)"
          python - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          shots = json.load(open("plan.json"))["shots"]
          if os.environ["PREV"] == "true":
              m = [{"toma": i, "rango": ""} for i in range(len(shots))]
          else:  # cada toma en pedazos de 12 frames -> hasta 20 servidores en paralelo
              m = [{"toma": i, "rango": f"{a}-{min(a + 11, s['frames'])}"} for i, s in enumerate(shots) for a in range(1, s["frames"] + 1, 12)]
          print("tomas=" + json.dumps(m))
          PY
      - name: Bajar modelo (una sola vez)
        env: { SKETCHFAB_TOKEN: "${{ secrets.SKETCHFAB_TOKEN }}" }
        run: |
          CAR=$(bash edits/bajar_modelo.sh $MODELO m)
          test -s "$CAR" || { echo "No se pudo bajar el modelo"; exit 1; }
          echo "$CAR" > m/ruta.txt; ls -la m | head
          if grep -q '"escenario": "exterior"' plan.json; then
            H=$(python -c "import random;print(random.choice(['wide_street_01','wide_street_02','driving_school','derelict_overpass','canary_wharf','docklands_02','empty_warehouse_01','autoshop_01','shanghai_bund','hansaplatz','rooftop_night']))")
            echo "Cielo: $H"
            curl -sfL "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/${H}_4k.hdr" -o m/cielo.hdr
            python -c "import json;p=json.load(open('plan.json'));p['hdri']='m/cielo.hdr';p['hdri_nombre']='$H';json.dump(p,open('plan.json','w'),indent=1)"
          else
            bash edits/bajar_estudio.sh m/estudio.hdr && python -c "import json;p=json.load(open('plan.json'));p['hdri_estudio']='m/estudio.hdr';json.dump(p,open('plan.json','w'),indent=1)" || true
          fi
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: "plan.json\nmusica.mp3" }
      - uses: actions/upload-artifact@v4
        with: { name: modelo, path: m/ }

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tomas) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: plan }
      - uses: actions/download-artifact@v4
        with: { name: modelo, path: m }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3 > /dev/null
      - uses: actions/cache@v4
        with: { path: ~/blender, key: blender-4.2.3 }
      - name: Blender
        run: |
          if [ ! -x ~/blender/blender ]; then mkdir -p ~/blender && curl -sfL "$BLENDER_URL" | tar -xJ -C ~/blender --strip-components=1; fi
          ~/blender/blender --version | head -1
      - run: echo "CAR=$(cat m/ruta.txt)" >> $GITHUB_ENV && test -s "$(cat m/ruta.txt)"
      - name: Render toma ${{ matrix.toma }} ${{ matrix.rango }}
        run: |
          EXTRA=""; [ "${{ needs.plan.outputs.preview }}" = "true" ] && EXTRA="--still"; [ -n "${{ matrix.rango }}" ] && EXTRA="--rango ${{ matrix.rango }}"
          FRONT=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print(m.get('${{ needs.plan.outputs.modelo }}',{}).get('frente','auto'))")
          GIRAR=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print('--girar' if m.get('${{ needs.plan.outputs.modelo }}',{}).get('girar') else '')")
          ~/blender/blender -b -noaudio -P edits/blender_edit.py -- --plan plan.json --shot ${{ matrix.toma }} \
            --car "$CAR" --uid "${{ needs.plan.outputs.modelo }}" --front "$FRONT" $GIRAR --out salida $EXTRA 2>&1 | grep -vE "^Fra:|Sample" | tail -40
          ls -la salida
      - uses: actions/upload-artifact@v4
        with: { name: "toma-${{ matrix.toma }}-${{ strategy.job-index }}", path: salida/ }

  montar:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: arte, pattern: "toma-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: arte, name: plan }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Montar
        run: |
          mkdir -p out
          cp arte/plan.json out/
          if ls arte/still_*.jpg >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -pattern_type glob -i 'arte/still_*.jpg' -vf "scale=360:-1,tile=6x4" -frames:v 1 out/preview.jpg
          else
            (cd arte && mkdir -p tomas && mv toma_*.mp4 tomas/ && bash ../edits/montar.sh plan.json tomas ../out/edit.mp4)
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: edit-final, path: out }
      - name: Guardar en la rama renders
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          if git fetch -q origin renders:renders 2>/dev/null; then git switch -q renders; else git switch -q --orphan renders; fi
          D=$(date -u +%Y%m%d-%H%M); mkdir -p "$D"; cp out/* "$D"/
          git add "$D"; git commit -qm "render $D"; git push -q origin renders
          echo "Guardado en renders/$D"
