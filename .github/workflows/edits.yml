name: Edit de coche (Blender)

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: "UID de Sketchfab de un modelo APROBADO (edits/modelos.json)"
        required: true
      preview:
        description: "true = 1 frame por toma a resolución completa (revisión antes del render largo)"
        default: "true"
      musica:
        description: "URL del mp3 (vacío = phonk al azar de edits/musica.json, sin Content ID)"
        default: ""
      segundos:
        description: "Duración del edit"
        default: "14"
      escenario:
        description: "estudio | exterior | vacío = al azar"
        default: ""
      color:
        description: "teal | calido | mono | vacío = al azar"
        default: ""

permissions:
  contents: write

env:
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tomas: ${{ steps.p.outputs.tomas }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q librosa
      - id: p
        run: |
          URL="${{ inputs.musica }}"
          [ -z "$URL" ] && URL=$(python -c "import json,random;print(random.choice(json.load(open('edits/musica.json')))['mp3'])")
          echo "Música: $URL"
          curl -sfL -A "Mozilla/5.0" "$URL" -o musica.mp3
          python edits/plan.py musica.mp3 plan.json ${{ inputs.segundos }} "${{ inputs.escenario }}" "${{ inputs.color }}"
          PREV="${{ inputs.preview }}" python - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          shots = json.load(open("plan.json"))["shots"]
          if os.environ["PREV"] == "true":
              m = [{"toma": i, "rango": ""} for i in range(len(shots))]
          else:  # cada toma en pedazos de 12 frames -> hasta 20 servidores en paralelo
              m = [{"toma": i, "rango": f"{a}-{min(a + 11, s['frames'])}"} for i, s in enumerate(shots) for a in range(1, s["frames"] + 1, 12)]
          print("tomas=" + json.dumps(m))
          PY
      - name: Bajar modelo (una sola vez)
        env: { SKETCHFAB_TOKEN: "${{ secrets.SKETCHFAB_TOKEN }}" }
        run: |
          CAR=$(bash edits/bajar_modelo.sh ${{ inputs.modelo }} m)
          test -s "$CAR" || { echo "No se pudo bajar el modelo"; exit 1; }
          echo "$CAR" > m/ruta.txt; ls -la m | head
          if grep -q '"escenario": "exterior"' plan.json; then
            H=$(python -c "import random;print(random.choice(['wide_street_01','wide_street_02','driving_school','derelict_overpass','canary_wharf','docklands_02','empty_warehouse_01','autoshop_01','shanghai_bund','hansaplatz','rooftop_night','cobblestone_street_night']))")
            echo "Cielo: $H"
            curl -sfL "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/${H}_4k.hdr" -o m/cielo.hdr
            python -c "import json;p=json.load(open('plan.json'));p['hdri']='m/cielo.hdr';p['hdri_nombre']='$H';json.dump(p,open('plan.json','w'),indent=1)"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: "plan.json\nmusica.mp3" }
      - uses: actions/upload-artifact@v4
        with: { name: modelo, path: m/ }

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tomas) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: plan }
      - uses: actions/download-artifact@v4
        with: { name: modelo, path: m }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3 > /dev/null
      - uses: actions/cache@v4
        with: { path: ~/blender, key: blender-4.2.3 }
      - name: Blender
        run: |
          if [ ! -x ~/blender/blender ]; then mkdir -p ~/blender && curl -sfL "$BLENDER_URL" | tar -xJ -C ~/blender --strip-components=1; fi
          ~/blender/blender --version | head -1
      - run: echo "CAR=$(cat m/ruta.txt)" >> $GITHUB_ENV && test -s "$(cat m/ruta.txt)"
      - name: Render toma ${{ matrix.toma }} ${{ matrix.rango }}
        run: |
          EXTRA=""; [ "${{ inputs.preview }}" = "true" ] && EXTRA="--still"; [ -n "${{ matrix.rango }}" ] && EXTRA="--rango ${{ matrix.rango }}"
          FRONT=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print(m.get('${{ inputs.modelo }}',{}).get('frente','auto'))")
          GIRAR=$(python3 -c "import json;m={x['uid']:x for x in json.load(open('edits/modelos.json'))};print('--girar' if m.get('${{ inputs.modelo }}',{}).get('girar') else '')")
          ~/blender/blender -b -noaudio -P edits/blender_edit.py -- --plan plan.json --shot ${{ matrix.toma }} \
            --car "$CAR" --front "$FRONT" $GIRAR --out salida $EXTRA 2>&1 | grep -vE "^Fra:|Sample" | tail -40
          ls -la salida
      - uses: actions/upload-artifact@v4
        with: { name: "toma-${{ matrix.toma }}-${{ strategy.job-index }}", path: salida/ }

  montar:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: arte, pattern: "toma-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: arte, name: plan }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Montar
        run: |
          mkdir -p out
          cp arte/plan.json out/
          if ls arte/still_*.jpg >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -pattern_type glob -i 'arte/still_*.jpg' -vf "scale=360:-1,tile=6x4" -frames:v 1 out/preview.jpg
          else
            (cd arte && mkdir -p tomas && mv toma_*.mp4 tomas/ && bash ../edits/montar.sh plan.json tomas ../out/edit.mp4)
          fi
          ls -la out
      - name: Guardar en la rama renders
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          if git fetch -q origin renders:renders 2>/dev/null; then git switch -q renders; else git switch -q --orphan renders; fi
          D=$(date -u +%Y%m%d-%H%M); mkdir -p "$D"; cp out/* "$D"/
          git add "$D"; git commit -qm "render $D"; git push -q origin renders
          echo "Guardado en renders/$D"
