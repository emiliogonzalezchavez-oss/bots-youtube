name: Buscar modelos Sketchfab
# Busca modelos descargables CC BY / CC BY-SA y guarda la lista en la rama renders (busquedas/).
on:
  workflow_dispatch:
    inputs:
      consultas: { description: "búsquedas separadas por |", required: true }
permissions: { contents: write }
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { SKETCHFAB_TOKEN: "${{ secrets.SKETCHFAB_TOKEN }}", Q: "${{ inputs.consultas }}" }
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          out = []
          for q in os.environ["Q"].split("|"):
              for lic in ("by", "by-sa"):
                  url = "https://api.sketchfab.com/v3/search?" + urllib.parse.urlencode(
                      {"type": "models", "q": q, "downloadable": "true", "license": lic, "count": 24, "sort_by": "-likeCount"})
                  req = urllib.request.Request(url, headers={"Authorization": "Token " + os.environ["SKETCHFAB_TOKEN"]})
                  try:
                      d = json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      print("ERR", q, e); continue
                  for r in d.get("results", []):
                      out.append({"q": q, "uid": r["uid"], "name": r["name"], "license": (r.get("license") or {}).get("label", lic),
                                  "faces": r.get("faceCount"), "verts": r.get("vertexCount"), "likes": r.get("likeCount"),
                                  "autor": (r.get("user") or {}).get("displayName"),
                                  "thumb": max((t for t in (r.get("thumbnails") or {}).get("images", [])), key=lambda t: t.get("width", 0), default={}).get("url")})
          json.dump(out, open("res.json", "w"), indent=1, ensure_ascii=False); print(len(out))
          PY
          git config user.name "github-actions"; git config user.email "actions@github.com"
          cp res.json /tmp/res.json
          if git fetch -q origin renders:renders 2>/dev/null; then git switch -q renders; else git switch -q --orphan renders; fi
          mkdir -p busquedas; D=busquedas/$(date -u +%Y%m%d-%H%M).json; cp /tmp/res.json "$D"
          git add busquedas; git commit -qm "busqueda"; git push -q origin renders; echo "$D"
